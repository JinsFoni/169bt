# 发布 Release 时自动构建多架构 Docker 镜像并推送到 GHCR。
#
# ★ 触发条件**只有** release published——push / PR 一律不构建（刻意从简，
#   个人项目不需要每个 commit 出镜像）。
#
# tag 规则（docker/metadata-action semver）：release tag v0.2.0 →
#   ghcr.io/<owner>/169bt:0.2.0  :0.2  :latest
#
# 前置：无需配置任何 secret，GITHUB_TOKEN 由 Actions 自动注入。

name: release-image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata（tags & labels）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
