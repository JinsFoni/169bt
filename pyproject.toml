[project]
name = "bt169"
version = "1.0.1"
description = "169bt 归档台 —— 个人自用的 4K 帖归档与 ED2K 提取"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [socks]：代理设置支持 socks5（httpx 走 socksio；不装则 socks5 URL 报错）
    "httpx[socks]>=0.27",
    "cryptography>=42",
    # [asyncio]：Telethon 的 proxy= 参数依赖 python-socks——**不装则 Telethon
    # 静默忽略 proxy**（_parse_proxy 返回 None），TG 直连，故障极难排查。
    "python-socks[asyncio]>=2",
    "telethon>=1.36",
    # RSS/HTML 解析（source/parse.py）与图片处理（collector/imagecache.py）。
    # 曾漏声明：本地 venv 手工装过能跑，pip install 后即 ModuleNotFoundError
    # ——依赖必须以 pyproject 为准。
    "selectolax>=0.3",
    "pillow>=10",
    # 验证码识别（source/captcha.py，延迟导入）。onnxruntime 是它的传递依赖。
    "ddddocr>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bt169 = "bt169.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bt169 = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
